services:
  notifications:
    build: .
    restart: unless-stopped
    init: true
    environment:
      SERVICE_URL_NOTIFICATIONS_3001: /
      ADMIN_API_KEY: ${SERVICE_PASSWORD_64_NOTIFICATIONS}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      RESEND_FROM: ${RESEND_FROM:-notifications@estasinvitado.lat}
      DATABASE_PATH: /data/notifications.sqlite
      PORT: 3001
    expose:
      - '3001'
    volumes:
      - notifications-data:/data
volumes:
  notifications-data:
